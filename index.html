<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#16a34a">
    <title>Delivery Track Pro - Cah Sragen</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            padding-bottom: 20px;
        }
        .app-container { max-width: 480px; margin: 0 auto; padding: 16px; }
        
        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #0f1724 0%, #1a2a3a 100%);
            border-radius: 20px;
            padding: 20px;
            color: white;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
        .header-title span { color: #4ade80; }
        .header-status {
            display: flex; align-items: center; gap: 8px;
            font-size: 11px; font-weight: 700;
            background: rgba(255,255,255,0.1);
            padding: 4px 12px; border-radius: 20px;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        .status-dot.online { background: #4ade80; }
        .status-dot.offline { background: #f87171; }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .header-deliman { margin-top: 12px; font-size: 14px; opacity: 0.8; }
        .header-deliman strong { color: #4ade80; }
        
        /* ===== CARD ===== */
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .card-title {
            font-size: 14px; font-weight: 700; color: #1a1a2e;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }
        .card-title .icon { font-size: 18px; }
        
        /* ===== FORM ===== */
        .form-group { margin-bottom: 14px; }
        .form-label {
            display: block; font-size: 12px; font-weight: 700;
            color: #4a4a6a; margin-bottom: 4px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-input {
            width: 100%; padding: 12px 14px;
            border: 2px solid #e8ecf1; border-radius: 12px;
            font-size: 15px; font-weight: 500;
            outline: none; transition: all 0.2s;
            background: #fafbfc;
        }
        .form-input:focus {
            border-color: #16a34a;
            background: white;
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.1);
        }
        .form-input:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; padding: 14px 24px; border: none;
            border-radius: 12px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            width: 100%; text-decoration: none;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: #16a34a; color: white;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.3);
        }
        .btn-primary:hover { background: #15803d; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-success {
            background: #25D366; color: white;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.3);
        }
        .btn-success:hover { background: #1da851; }
        .btn-black { background: #1a1a2e; color: white; }
        .btn-black:hover { background: #2a2a4e; }
        .btn-outline {
            background: transparent; border: 2px solid #e8ecf1; color: #1a1a2e;
        }
        .btn-outline:hover { border-color: #16a34a; color: #16a34a; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-sm { padding: 10px 16px; font-size: 12px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* ===== STEPS ===== */
        .steps {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
            padding: 0 4px;
        }
        .step-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            flex: 1; position: relative; cursor: pointer;
        }
        .step-circle {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px;
            border: 3px solid #e8ecf1;
            background: white; color: #a0a0b8;
            transition: all 0.3s; position: relative; z-index: 1;
        }
        .step-circle.active {
            border-color: #16a34a; background: #16a34a;
            color: white; box-shadow: 0 4px 16px rgba(22, 163, 74, 0.3);
        }
        .step-circle.done {
            border-color: #16a34a; background: #16a34a; color: white;
        }
        .step-label {
            font-size: 9px; font-weight: 700; text-transform: uppercase;
            color: #a0a0b8; letter-spacing: 0.5px;
        }
        .step-label.active { color: #16a34a; }
        .step-line {
            flex: 1; height: 3px; background: #e8ecf1;
            margin: 0 -4px; position: relative;
            top: -20px; z-index: 0;
        }
        .step-line.done { background: #16a34a; }
        
        /* ===== PHOTO ===== */
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .photo-box {
            aspect-ratio: 4/3;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            background: #fafbfc; overflow: hidden;
            position: relative;
        }
        .photo-box.has-photo {
            border-color: #16a34a; border-style: solid;
            background: #f0fdf4;
        }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .photo-box .placeholder {
            font-size: 11px; color: #9ca3af;
            text-align: center; padding: 8px;
        }
        .photo-box .placeholder .big-icon { font-size: 32px; display: block; margin-bottom: 4px; }
        .photo-box .remove-btn {
            position: absolute; top: 4px; right: 4px;
            background: rgba(239, 68, 68, 0.9);
            color: white; border: none; border-radius: 50%;
            width: 24px; height: 24px; font-size: 12px;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
        
        /* ===== LOCATION ===== */
        .location-card {
            background: #0f1724;
            border-radius: 12px;
            padding: 16px;
            color: white;
            margin-top: 12px;
        }
        .location-card .label {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 1px; opacity: 0.6;
            font-weight: 700;
        }
        .location-card .coords {
            font-family: 'Courier New', monospace;
            font-size: 14px; font-weight: 600;
            margin: 4px 0;
        }
        .location-card .time { font-size: 12px; opacity: 0.6; }
        
        /* ===== SIGNATURE ===== */
        .signature-area {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            height: 160px;
            background: white;
            touch-action: none;
            cursor: crosshair;
            position: relative;
            overflow: hidden;
        }
        .signature-area canvas {
            width: 100%; height: 100%;
            display: block; touch-action: none;
        }
        .signature-area .placeholder {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #9ca3af; font-size: 13px;
            pointer-events: none;
        }
        .signature-actions {
            display: flex; gap: 10px; margin-top: 10px;
        }
        .signature-actions .btn { flex: 1; }
        
        /* ===== LOG ===== */
        .log-item {
            display: flex; gap: 12px; padding: 12px;
            background: #f8fafc; border-radius: 12px;
            margin-bottom: 8px; border-left: 4px solid #16a34a;
            cursor: pointer; transition: all 0.2s;
        }
        .log-item:hover { background: #f1f5f9; }
        .log-item .log-date {
            font-size: 11px; color: #6b7280;
            font-weight: 600; min-width: 70px;
        }
        .log-item .log-info { flex: 1; }
        .log-item .log-info .name { font-weight: 700; font-size: 14px; }
        .log-item .log-info .detail { font-size: 12px; color: #6b7280; }
        .log-item .log-status {
            font-size: 10px; font-weight: 700;
            padding: 2px 10px; border-radius: 20px;
            background: #dcfce7; color: #16a34a;
            align-self: center;
        }
        
        /* ===== FOOTER ===== */
        .footer {
            text-align: center; padding: 24px 16px 8px;
            font-size: 12px; color: #6b7280;
            border-top: 1px solid #e8ecf1; margin-top: 16px;
        }
        .footer .heart { color: #ef4444; }
        .footer .name { color: #1a1a2e; font-weight: 700; }
        .footer .social-links {
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 6px; margin-top: 8px;
        }
        .footer .social-links a {
            color: #6b7280; text-decoration: none; font-size: 11px;
            padding: 2px 10px; border-radius: 12px;
            background: #f1f5f9; transition: all 0.2s;
        }
        .footer .social-links a:hover { background: #16a34a; color: white; }
        .footer .ai-credit {
            margin-top: 10px; padding: 12px;
            background: linear-gradient(135deg, #0f1724, #1a2a3a);
            border-radius: 12px; color: white; font-size: 11px;
        }
        .footer .ai-credit .whale {
            font-size: 28px; display: inline-block;
            animation: swim 3s ease-in-out infinite;
        }
        @keyframes swim {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(8px); }
        }
        
        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        .modal-content {
            background: white; border-radius: 20px;
            max-width: 480px; width: 100%; max-height: 90vh;
            overflow-y: auto; padding: 24px;
            animation: slideUp 0.3s ease;
        }
        .modal-content .modal-title {
            font-size: 18px; font-weight: 700; margin-bottom: 12px;
        }
        .modal-content .modal-close {
            float: right; background: none; border: none;
            font-size: 24px; cursor: pointer; color: #6b7280;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e; color: white;
            padding: 12px 24px; border-radius: 16px;
            font-weight: 600; font-size: 14px;
            z-index: 2000; max-width: 90%; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.3s ease;
        }
        
        /* ===== HIDDEN ===== */
        .hidden-input { display: none; }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 4px; }
        
        /* ===== BADGE ===== */
        .badge {
            display: inline-block; padding: 2px 10px;
            border-radius: 12px; font-size: 10px; font-weight: 700;
        }
        .badge-green { background: #dcfce7; color: #16a34a; }
        .badge-orange { background: #fef3c7; color: #d97706; }
        
        /* ===== UTILITY ===== */
        .text-center { text-align: center; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mt-16 { margin-top: 16px; }
        .mt-20 { margin-top: 20px; }
        .gap-8 { gap: 8px; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-4 { gap: 4px; }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 400px) {
            .app-container { padding: 10px; }
            .card { padding: 14px; }
            .header { padding: 14px; }
            .header-title { font-size: 18px; }
            .photo-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .btn-group { grid-template-columns: 1fr; }
            .step-circle { width: 34px; height: 34px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="app" class="app-container"></div>

<script>
// ================================================================
// DELIVERY TRACK PRO - FULL APPLICATION (FIX KAMERA)
// Cah Sragen 77 x DeepSeek AI
// ================================================================

// ================================================================
// STATE
// ================================================================

const STATE = {
    profile: {
        namaDeliman: '',
        noDeliman: '',
        noKonsumen: '',
        namaKonsumen: '',
        noToko: '6281122220723'
    },
    delivery: {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        resiNumber: '',
        fotoBarang: null,
        fotoStruk: null,
        fotoSerah: null,
        tandaTangan: null,
        lokasiBerangkat: null,
        lokasiSampai: null,
        status: 'draft',
        createdAt: Date.now()
    },
    logs: [],
    step: 1,
    isOnline: navigator.onLine,
    toast: null,
    modal: null,
    isLoading: false,
    isDrawing: false,
    signatureData: null,
    watchId: null,
    currentLocation: null,
};

// ================================================================
// HELPERS
// ================================================================

const $ = (sel, ctx = document) => ctx.querySelector(sel);
const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function formatTime(ts) {
    return new Date(ts).toLocaleString('id-ID', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
    }) + ' WIB';
}

function formatDuration(ms) {
    const minutes = Math.floor(ms / 60000);
    const seconds = Math.floor((ms % 60000) / 1000);
    return `${minutes}m ${seconds}s`;
}

function normalizePhone(phone) {
    let p = phone.replace(/\D/g, '');
    if (p.startsWith('0')) p = '62' + p.slice(1);
    if (p.startsWith('8')) p = '62' + p;
    if (!p.startsWith('62')) p = '62' + p;
    return p;
}

function haversine(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getGoogleMapsRouteUrl(lat1, lng1, lat2, lng2) {
    return `https://www.google.com/maps/dir/${lat1},${lng1}/${lat2},${lng2}`;
}

function getGoogleMapsLocationUrl(lat, lng) {
    return `https://www.google.com/maps?q=${lat},${lng}`;
}

// ================================================================
// TOAST
// ================================================================

function showToast(message, duration = 3000) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => toast.remove(), duration);
}

// ================================================================
// STORAGE
// ================================================================

function saveToStorage(key, data) {
    try {
        localStorage.setItem(`delivery_${key}`, JSON.stringify(data));
    } catch (e) {
        console.warn('Storage save failed:', e);
    }
}

function loadFromStorage(key) {
    try {
        const data = localStorage.getItem(`delivery_${key}`);
        return data ? JSON.parse(data) : null;
    } catch (e) {
        console.warn('Storage load failed:', e);
        return null;
    }
}

// ================================================================
// WHATSAPP
// ================================================================

function sendWA(phone, message) {
    const p = normalizePhone(phone);
    const url = `https://wa.me/${p}?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
}

// ================================================================
// FOTO KAMERA (FIX)
// ================================================================

function openCamera(inputId, callback) {
    const input = document.getElementById(inputId);
    if (!input) {
        showToast('⚠️ Error: input tidak ditemukan');
        return;
    }
    
    // Cek apakah device support kamera
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        // Coba akses kamera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(() => {
                // Sukses, trigger input file
                input.click();
            })
            .catch((err) => {
                console.warn('Kamera tidak bisa diakses:', err);
                // Fallback: tetap buka file picker
                showToast('📷 Kamera tidak bisa diakses, pilih dari galeri');
                input.click();
            });
    } else {
        // Device tidak support getUserMedia, langsung buka file picker
        showToast('📷 Pilih foto dari galeri');
        input.click();
    }
}

// ================================================================
// RENDER
// ================================================================

function render() {
    const app = document.getElementById('app');
    
    if (!STATE.profile.namaDeliman || !STATE.profile.noDeliman || 
        !STATE.profile.namaKonsumen || !STATE.profile.noKonsumen) {
        app.innerHTML = renderSetup();
        attachSetupEvents();
        return;
    }
    
    app.innerHTML = renderMain();
    attachMainEvents();
    updateStepUI();
}

// ================================================================
// RENDER: SETUP
// ================================================================

function renderSetup() {
    const p = STATE.profile;
    return `
        <div class="card" style="margin-top:20px;">
            <div class="card-title"><span class="icon">🚚</span> Setup Deliman</div>
            
            <div class="form-group">
                <label class="form-label">Nama Deliman *</label>
                <input id="input-nama" class="form-input" value="${p.namaDeliman}" placeholder="Masukkan nama lengkap">
            </div>
            
            <div class="form-group">
                <label class="form-label">No HP Deliman (WA) *</label>
                <input id="input-no-deliman" class="form-input" value="${p.noDeliman}" placeholder="08xx atau 62xx">
            </div>
            
            <div class="form-group">
                <label class="form-label">Nama Konsumen *</label>
                <input id="input-nama-konsumen" class="form-input" value="${p.namaKonsumen}" placeholder="Nama penerima">
            </div>
            
            <div class="form-group">
                <label class="form-label">No HP Konsumen (WA) *</label>
                <input id="input-no-konsumen" class="form-input" value="${p.noKonsumen}" placeholder="08xx penerima">
            </div>
            
            <div class="form-group">
                <label class="form-label">No HP Toko (WA Laporan)</label>
                <input id="input-no-toko" class="form-input" value="${p.noToko || '6281122220723'}" placeholder="08xx admin toko">
            </div>
            
            <button id="btn-save-profile" class="btn btn-primary mt-16">
                ✅ SIMPAN & MULAI DELIVERY
            </button>
            
            <p style="font-size:11px;color:#9ca3af;text-align:center;margin-top:12px;">
                Data tersimpan di localStorage. Bisa offline.
            </p>
        </div>
        
        <div class="footer">
            <p>Handcrafted with <span class="heart">❤</span> by <span class="name">Andrew Dwiranto</span> (Cah_Sragen_77, Indonesia)</p>
        </div>
    `;
}

function attachSetupEvents() {
    const btn = document.getElementById('btn-save-profile');
    if (!btn) return;
    
    btn.addEventListener('click', () => {
        const nama = document.getElementById('input-nama')?.value?.trim();
        const noDeliman = document.getElementById('input-no-deliman')?.value?.trim();
        const namaKonsumen = document.getElementById('input-nama-konsumen')?.value?.trim();
        const noKonsumen = document.getElementById('input-no-konsumen')?.value?.trim();
        const noToko = document.getElementById('input-no-toko')?.value?.trim() || '6281122220723';
        
        if (!nama) { showToast('⚠️ Masukkan nama deliman'); return; }
        if (!noDeliman) { showToast('⚠️ Masukkan no HP deliman'); return; }
        if (!namaKonsumen) { showToast('⚠️ Masukkan nama konsumen'); return; }
        if (!noKonsumen) { showToast('⚠️ Masukkan no HP konsumen'); return; }
        if (noDeliman.replace(/\D/g, '').length < 9) { showToast('⚠️ No HP deliman minimal 9 digit'); return; }
        if (noKonsumen.replace(/\D/g, '').length < 9) { showToast('⚠️ No HP konsumen minimal 9 digit'); return; }
        
        STATE.profile = { namaDeliman: nama, noDeliman, namaKonsumen, noKonsumen, noToko };
        saveToStorage('profile', STATE.profile);
        
        showToast('✅ Profil tersimpan!');
        render();
    });
}

// ================================================================
// RENDER: MAIN
// ================================================================

function renderMain() {
    const p = STATE.profile;
    const d = STATE.delivery;
    const step = STATE.step;
    
    return `
        <div class="header">
            <div class="header-top">
                <div class="header-title">DELIVERY <span>PRO</span></div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <button onclick="resetToSetup()" style="
                        background:rgba(255,255,255,0.15);
                        border:none; color:white;
                        padding:4px 12px; border-radius:20px;
                        font-size:10px; font-weight:700;
                        cursor:pointer;
                    ">
                        🔄 Reset
                    </button>
                    <div class="header-status">
                        <span class="status-dot ${STATE.isOnline ? 'online' : 'offline'}"></span>
                        ${STATE.isOnline ? 'ONLINE' : 'OFFLINE'}
                    </div>
                </div>

function exportExcel() {
    const logs = STATE.logs;
    if (logs.length === 0) {
        showToast('⚠️ Belum ada log untuk di-export');
        return;
    }
    
    const headers = ['ID', 'Waktu', 'Deliman', 'No Deliman', 'Konsumen', 'No Konsumen', 
                     'Resi', 'Jarak (km)', 'Durasi (menit)', 'Lat Berangkat', 'Lng Berangkat', 
                     'Lat Sampai', 'Lng Sampai', 'Status'];
    
    const rows = logs.map(log => [
        log.id,
        log.waktu || '',
        log.namaDeliman || '',
        log.noDeliman || '',
        log.namaKonsumen || '',
        log.noKonsumen || '',
        log.resiNumber || '',
        log.jarak || '0',
        log.durasi || '0',
        log.lokasiBerangkat?.lat?.toFixed(6) || '',
        log.lokasiBerangkat?.lng?.toFixed(6) || '',
        log.lokasiSampai?.lat?.toFixed(6) || '',
        log.lokasiSampai?.lng?.toFixed(6) || '',
        log.status || ''
    ]);
    
    let csv = headers.join(',') + '\n';
    rows.forEach(row => {
        csv += row.map(cell => `"${cell}"`).join(',') + '\n';
    });
    
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = `delivery-log-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    showToast('✅ Excel berhasil di-export!');
}

function exportToGoogleSheets() {
    const logs = STATE.logs;
    if (logs.length === 0) {
        showToast('⚠️ Belum ada log untuk di-export');
        return;
    }
    
    let html = '<html><head><meta charset="UTF-8"></head><body><table border="1" style="border-collapse:collapse;font-family:sans-serif;">';
    
    html += '<tr style="background:#16a34a;color:white;">';
    ['ID', 'Waktu', 'Deliman', 'No Deliman', 'Konsumen', 'No Konsumen', 
     'Resi', 'Jarak (km)', 'Durasi (menit)', 'Lat Berangkat', 'Lng Berangkat', 
     'Lat Sampai', 'Lng Sampai', 'Status'].forEach(h => {
        html += `<th style="padding:8px 12px;border:1px solid #ccc;">${h}</th>`;
    });
    html += '</tr>';
    
    logs.forEach((log, i) => {
        const bg = i % 2 === 0 ? 'white' : '#f8fafc';
        html += `<tr style="background:${bg};">`;
        html += `<td style="padding:6px 10px;border:1px solid #ccc;">${log.id || ''}</td>`;
        html += `<td style="padding:6px 10px;border:1px solid #ccc;">${log.waktu || ''}</td>`;
        html += `<td style="padding:6px 10px;border:1px solid #ccc;">${log.namaDeliman || ''}</td>`;
        html += `<td style="padding:6px 10px;border:1px solid #ccc;">${log.noDeliman || ''}</td>`;
        html += `<td style="padding:6px 10px;border:1px solid #ccc;">${log.namaKonsumen || ''}</td>`;
        html += `<td style="padding:6px 10px;border:1px solid #ccc;">${log.noKonsumen || ''}</td>`;
        html += `<td style="padding:6px 10px;border:1px solid #ccc;">${log.resiNumber || ''}</td>`;
        html += `<td style="padding:6px 10px;border:1px solid #ccc;">${log.jarak || '0'}</td>`;
        html += `<td style="padding:6px 10px;border:1px solid #ccc;">${log.durasi || '0'}</td>`;

        html += '</tr>';
    });
    
    html += '</table></body></html>';
    
    const win = window.open('', '_blank');
    if (win) {
        win.document.write(html);
        win.document.close();
        showToast('✅ Copy tabel, paste ke Google Sheets!');
    } else {
        const blob = new Blob([html], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `delivery-log-${new Date().toISOString().slice(0,10)}.html`;
        link.click();
        showToast('✅ Download HTML, buka di browser lalu copy ke Sheets');
    }
}

let signatureCanvas = null;
let signatureCtx = null;
let isDrawing = false;
let lastX = 0;
let lastY = 0;

function initSignature() {
    const canvas = document.getElementById('signature-canvas');
    if (!canvas) return;
    
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * 2;
    canvas.height = 160 * 2;
    canvas.style.width = '100%';
    canvas.style.height = '160px';
    
    signatureCanvas = canvas;
    signatureCtx = canvas.getContext('2d');
    signatureCtx.scale(2, 2);
    signatureCtx.lineWidth = 2.5;
    signatureCtx.lineCap = 'round';
    signatureCtx.lineJoin = 'round';
    signatureCtx.strokeStyle = '#1a1a2e';
    
    if (STATE.delivery.tandaTangan) {
        const img = new Image();
        img.onload = () => {
            signatureCtx.drawImage(img, 0, 0, canvas.width/2, canvas.height/2);
        };
        img.src = STATE.delivery.tandaTangan;
    }
    
    const startDraw = (e) => {
        e.preventDefault();
        const rect2 = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches?.[0]?.clientX || 0) - rect2.left;
        const y = (e.clientY || e.touches?.[0]?.clientY || 0) - rect2.top;
        isDrawing = true;
        lastX = x;
        lastY = y;
        signatureCtx.beginPath();
        signatureCtx.moveTo(x, y);
    };
    
    const draw = (e) => {
        e.preventDefault();
        if (!isDrawing) return;
        const rect2 = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches?.[0]?.clientX || 0) - rect2.left;
        const y = (e.clientY || e.touches?.[0]?.clientY || 0) - rect2.top;
        signatureCtx.lineTo(x, y);
        signatureCtx.stroke();
        lastX = x;
        lastY = y;
    };
    
    const endDraw = (e) => {
        e.preventDefault();
        isDrawing = false;
        const dataUrl = canvas.toDataURL('image/png');
        STATE.signatureData = dataUrl;
    };
    
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', endDraw);
    
    const btnClear = document.getElementById('btn-clear-ttd');
    if (btnClear) {
        btnClear.addEventListener('click', () => {
            signatureCtx.clearRect(0, 0, canvas.width/2, canvas.height/2);
            signatureCtx.fillStyle = 'white';
            signatureCtx.fillRect(0, 0, canvas.width/2, canvas.height/2);
            STATE.signatureData = null;
            STATE.delivery.tandaTangan = null;
            saveToStorage('delivery', STATE.delivery);
            showToast('🗑️ Tanda tangan dihapus');
        });
    }
    
    const btnSave = document.getElementById('btn-save-ttd');
    if (btnSave) {
        btnSave.addEventListener('click', () => {
            const dataUrl = canvas.toDataURL('image/png');
            STATE.delivery.tandaTangan = dataUrl;
            STATE.signatureData = dataUrl;
            saveToStorage('delivery', STATE.delivery);
            showToast('✅ Tanda tangan tersimpan!');
            const placeholder = document.querySelector('.signature-area .placeholder');
            if (placeholder) placeholder.style.display = 'none';
        });
    }
}

function attachMainEvents() {

                STATE.step = s;

            } else {
                showToast('⚠️ Selesaikan step sebelumnya dulu');

    // ===== STEP 1 =====

            });
        }
        
        $$('.log-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index);
                const log = STATE.logs[idx];
                if (log) showLogDetail(log);
            });
        });
    }
}

function updateStepUI() {}

// ================================================================
// NETWORK STATUS
// ================================================================

window.addEventListener('online', () => {
    STATE.isOnline = true;
    showToast('🌐 Kembali online!');
    render();
});

window.addEventListener('offline', () => {
    STATE.isOnline = false;
    showToast('✈️ Mode offline - tetap bisa delivery!');
    render();
});

// ================================================================
// LOAD DATA
// ================================================================

function loadSavedData() {
    const profile = loadFromStorage('profile');
    if (profile) STATE.profile = { ...STATE.profile, ...profile };
    
    const delivery = loadFromStorage('delivery');
    if (delivery) STATE.delivery = { ...STATE.delivery, ...delivery };
    
    const logs = loadFromStorage('logs');
    if (logs && Array.isArray(logs)) STATE.logs = logs;
    
    if (STATE.delivery.status === 'selesai') {
        STATE.step = 4;
    } else if (STATE.delivery.status === 'otw') {
        STATE.step = 2;
    } else if (STATE.delivery.status === 'sampai') {
        STATE.step = 3;
    } else if (STATE.delivery.fotoBarang && STATE.delivery.fotoStruk && STATE.delivery.lokasiBerangkat) {
        STATE.step = 2;
    } else if (STATE.delivery.fotoBarang || STATE.delivery.fotoStruk || STATE.delivery.lokasiBerangkat) {
        STATE.step = 1;
    }
}

// ================================================================
// INIT
// ================================================================

loadSavedData();
render();
